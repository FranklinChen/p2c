name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Build p2c and run the translated example programs on each runner's default
  # toolchain.
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # "make check" is "make test" plus the strict-C23 gate, so a contributor
      # running one command locally reproduces exactly what CI does.
      - name: Build, test, and check generated output
        run: make check

  # Containers rather than runners: GCC 15 was the first release to default to
  # C23, and neither ubuntu-latest nor macos-latest does, so both stayed green
  # for months while p2c did not build on GCC 15 or 16 at all. Why the dialect
  # matters is in the "handler" comment in src/trans.h.
  #
  # Both versions are pinned deliberately: 15 is the first C23-default release
  # and is what distributions ship, 16 is the newest available. They run
  # concurrently, so the second job costs billed minutes, not wall clock.
  modern-gcc:
    name: gcc ${{ matrix.gcc }}
    strategy:
      fail-fast: false
      matrix:
        gcc: ['15', '16']
    runs-on: ubuntu-latest
    container: gcc:${{ matrix.gcc }}
    steps:
      - uses: actions/checkout@v7

      - name: Build, test, and check generated output
        run: make check CC=gcc

  # A shell script that is only "shellcheck-clean when someone remembers" is
  # not gated. Default severity: style and info findings count too.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  # The upstream and upstream-archives branches are the preservation half of
  # this repository: every surviving p2c release, and the original archives
  # they came from. Nothing else checks them, so a mangled or force-pushed
  # vendor branch would otherwise be discovered years later, by someone who
  # needed it. This rebuilds the release trees from the committed archives and
  # confirms each upstream/* tag still reproduces one.
  vendor-branches:
    name: vendor branches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify each upstream tag reproduces its archive
        run: |
          git fetch --tags origin \
            '+refs/heads/upstream:refs/heads/upstream' \
            '+refs/heads/upstream-archives:refs/heads/upstream-archives'
          scripts/fetch-upstream-lineage.sh /tmp/lineage
          git worktree add --detach /tmp/vendor-wt
          scripts/verify-upstream.sh /tmp/vendor-wt /tmp/lineage
